name: Feature request
description: Something LabNet should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The experiment or lab task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: safety
    attributes:
      label: Effect on safety checks
      description: Does it touch leases, limits, approvals or grants? How should those still hold?
