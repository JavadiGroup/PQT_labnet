# CI on the uv workspace (packages/). Still to come: lint, Linux, Docker and docs jobs.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: Generated protos and import rules
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: labnet driver build --core --check
        run: uv run labnet driver build --core --check --import-check
      - name: Import rules (lint-imports)
        run: uv run lint-imports

  test-windows:
    name: pytest (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: pytest
        # faulthandler dumps every thread's stack if a single test hangs.
        run: uv run pytest -ra -p no:cacheprovider -o faulthandler_timeout=300

  wheel-smoke:
    name: Wheels install and run
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheels
        run: uv build --all-packages --wheel -o dist
      - name: Install them in a clean venv and check them
        shell: bash
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/Scripts/python"
          "$py" -m pip install dist/labnet_control_center-*.whl dist/labnet_automation-*.whl \
              "$(ls dist/labnet-[0-9]*.whl)[central,lab-pc,certs]"
          cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
