# CI skeleton on the current single-package layout (Labnet/). The full job set
# (lint, Linux, Docker, wheel-smoke, docs) arrives with the 3.0 monorepo split.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Labnet

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Everything the test suite imports: runner (mcp), control-center (pypdf), certs (cryptography).
  LABNET_EXTRAS: dev,runner,control-center,certs

jobs:
  generated:
    name: Generated protos and import rules
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Labnet/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[${{ env.LABNET_EXTRAS }}]"
      - name: generate_protos.py --check
        run: python tools/generate_protos.py --check
      - name: Import rules (lint-imports)
        run: lint-imports

  test-windows:
    name: pytest (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Labnet/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[${{ env.LABNET_EXTRAS }}]"
      - name: pytest
        # faulthandler dumps every thread's stack if a single test hangs.
        run: python -m pytest -ra -p no:cacheprovider -o faulthandler_timeout=300
