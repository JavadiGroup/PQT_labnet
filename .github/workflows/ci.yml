# CI on the uv workspace (packages/). Still to come: lint, Linux and Docker jobs.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: Generated protos and import rules
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: labnet driver build --core --check
        run: uv run labnet driver build --core --check --import-check
      - name: labnet driver build --check (labnet-sim)
        run: uv run labnet driver build --check --import-check --project packages/labnet-sim
      - name: Import rules (lint-imports)
        run: uv run lint-imports
      - name: No site names in LabNet's code
        run: uv run python .github/scripts/no_site_names.py

  docs:
    name: Documentation (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build the site; a broken link or anchor fails it
        run: uv run --locked --group docs mkdocs build --strict

  test-windows:
    name: pytest (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the workspace
        run: uv sync --locked
      - name: pytest
        # faulthandler dumps every thread's stack if a single test hangs.
        run: uv run pytest -ra -p no:cacheprovider -o faulthandler_timeout=300 --junitxml=pytest-results.xml
      - name: Failed tests as annotations
        if: failure()
        run: uv run --no-project python .github/scripts/junit_annotations.py pytest-results.xml

  wheel-smoke:
    name: Wheels install and run
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheels
        run: uv build --all-packages --wheel -o dist
      - name: Install them in a clean venv and check them
        shell: bash
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/Scripts/python"
          "$py" -m pip install dist/labnet_control_center-*.whl dist/labnet_automation-*.whl dist/labnet_sim-*.whl \
              "$(ls dist/labnet-[0-9]*.whl)[central,lab-pc,certs]"
          cd "$RUNNER_TEMP" && "$py" "$GITHUB_WORKSPACE/.github/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"

  driver-template:
    name: Driver template round trip
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: labnet driver new, install, build, test
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/driver"
          py="$RUNNER_TEMP/driver/Scripts/python.exe"
          # uv pip takes the environment's folder (it no longer accepts .../Scripts/python without .exe)
          uv pip install --python "$RUNNER_TEMP/driver" -e packages/labnet
          "$RUNNER_TEMP/driver/Scripts/labnet" driver new acme-thing --service AcmeThing --directory "$RUNNER_TEMP/acme-thing"
          uv pip install --python "$RUNNER_TEMP/driver" -e packages/labnet -e "$RUNNER_TEMP/acme-thing[dev]"
          cd "$RUNNER_TEMP/acme-thing"
          "$RUNNER_TEMP/driver/Scripts/labnet" driver build --import-check
          "$RUNNER_TEMP/driver/Scripts/labnet" driver build --check
          "$py" -m pytest -q
