# Releases LabNet. A v* tag builds the four packages, checks them
# (.github/scripts/check_release.py), publishes them to PyPI and makes a GitHub
# Release.
#
# Publishing uses PyPI's Trusted Publishing, so no token is stored here. Each
# project on PyPI trusts this repository's release.yml in its own environment,
# pypi-<project>: PyPI accepts one pending publisher per repository, workflow
# and environment, so four projects need four.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build wheels and sdists
        run: uv build --all-packages -o dist
      - name: Check versions, files and changelog
        run: uv run --no-project python .github/scripts/check_release.py dist ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-notes.md

  publish:
    # One job per project, each in its own environment (see the top).
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: labnet, stem: labnet}
          - {project: labnet-control-center, stem: labnet_control_center}
          - {project: labnet-automation, stem: labnet_automation}
          - {project: labnet-sim, stem: labnet_sim}
    environment:
      name: pypi-${{ matrix.project }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Only ${{ matrix.project }}'s wheel and sdist
        run: mkdir upload && cp dist/${{ matrix.stem }}-[0-9]* upload/ && ls upload
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the release with the changelog section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "LabNet ${{ github.ref_name }}" --notes-file dist-notes.md
