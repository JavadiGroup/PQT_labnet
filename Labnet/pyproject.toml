[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet"
version = "2.0.0"
description = "Typed device control and acquisition services for a lab network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.81.1,<2.0",
    "httpx>=0.27,<1.0",
    "protobuf>=6.33.5,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
lab-pc = [
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "uvicorn>=0.30,<1.0",
]
control-center = [
    "fastapi>=0.115,<1.0",
    "pypdf>=5,<7",
    "uvicorn>=0.30,<1.0",
]
central = [
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.115,<1.0",
    "SQLAlchemy>=2.0.52,<3.0",
    "uvicorn>=0.30,<1.0",
]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
certs = [
    "cryptography>=42,<47",
]
runner = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.2,<2",
    "uvicorn>=0.30,<1.0",
]
dev = [
    "alembic>=1.19.1,<2.0",
    "cryptography>=42,<47",
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "grpcio-tools==1.81.1",
    "import-linter>=2.1,<3",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "SQLAlchemy>=2.0.52,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
labnet-central = "labnet.central.main:main"
labnet-central-admin = "labnet.central.manage:main"
labnet-lab-pc = "labnet.lab_pc.app:main"
labnet-certs = "labnet.certs:main"
labnet-control-center = "labnet.control_center.app:main"
labnet-control-center-admin = "labnet.control_center.admin:main"
labnet-automation-watchdog = "labnet.automation_watchdog.service:main"
labnet-runner = "labnet.automation_runner.supervisor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["labnet*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
labnet = ["py.typed"]
"labnet.grpc.generated" = ["*.pyi"]
"labnet.control_center" = [
    "agent_briefing.md",
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/panels/*.js",
]
"labnet.automation_runner" = ["automation_briefing.md"]
"labnet.central" = [
    "alembic.ini",
    "alembic/*.py",
    "alembic/*.mako",
    "alembic/versions/*.py",
]

[tool.setuptools.data-files]
"share/labnet/protos/labnet/devices/v1" = [
    "protos/labnet/devices/v1/*.proto",
]

[tool.importlinter]
root_package = "labnet"

# Core and the runner become separate packages from the Control Center in 3.0, so
# neither may depend on it. The watchdog is left out: it moves into the Control Center.
[[tool.importlinter.contracts]]
name = "Core and the Automation runner don't import the Control Center"
type = "forbidden"
source_modules = [
    "labnet.automation_runner",
    "labnet.central",
    "labnet.certs",
    "labnet.client",
    "labnet.device_manager",
    "labnet.devices",
    "labnet.envfile",
    "labnet.grpc",
    "labnet.identifiers",
    "labnet.lab_pc",
    "labnet.lease_policy",
    "labnet.redaction",
    "labnet.runner_api",
    "labnet.safe_paths",
]
forbidden_modules = ["labnet.control_center"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
