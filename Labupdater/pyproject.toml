[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labupdater"
version = "1.0.0"
description = "Independent release supervisor for LabNet Lab PCs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
labupdater = "labupdater.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["labupdater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
