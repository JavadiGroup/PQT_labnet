[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet-automation"
version = "3.0.0"
description = "The LabNet Automation runner: an agent's experiments in containers, run only under a person's approval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Robert Miller" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "labnet>=3.0.0,<3.1",
    "httpx>=0.27,<1.0",
    "mcp>=1.2,<2",
]

[project.urls]
Documentation = "https://mill0851.github.io/labnet/"
Source = "https://github.com/mill0851/labnet"
Issues = "https://github.com/mill0851/labnet/issues"
Changelog = "https://github.com/mill0851/labnet/blob/main/CHANGELOG.md"

[project.scripts]
labnet-runner = "labnet_automation.supervisor:main"

# `labnet runner build|up|down|...`: the runner next to a dev network.
[project.entry-points."labnet.commands"]
runner = "labnet_automation.host:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labnet_automation*"]
namespaces = false

[tool.setuptools.package-data]
labnet_automation = ["automation_briefing.md"]
