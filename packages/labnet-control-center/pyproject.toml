[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet-control-center"
version = "3.0.0"
description = "The LabNet Control Center: a web interface for a lab network, with the Automation safe-state watchdog"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Robert Miller" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "labnet>=3.0.0,<3.1",
    "fastapi>=0.115,<1.0",
    "pypdf>=5,<7",
    "uvicorn>=0.30,<1.0",
]

[project.urls]
Documentation = "https://mill0851.github.io/labnet/"
Source = "https://github.com/mill0851/labnet"
Issues = "https://github.com/mill0851/labnet/issues"
Changelog = "https://github.com/mill0851/labnet/blob/main/CHANGELOG.md"

[project.scripts]
labnet-control-center = "labnet_control_center.app:main"
labnet-control-center-admin = "labnet_control_center.admin:main"
labnet-watchdog = "labnet_control_center.watchdog.service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labnet_control_center*"]
namespaces = false

[tool.setuptools.package-data]
labnet_control_center = [
    "agent_briefing.md",
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/panels/*.js",
]
