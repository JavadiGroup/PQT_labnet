[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet-sim"
version = "3.0.0"
description = "Simulated LabNet devices: an optics bench (laser, AOM, EOM, AWG), a tunable laser and a wavemeter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Robert Miller" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "labnet>=3.0.0,<3.1",
]

[project.urls]
Documentation = "https://mill0851.github.io/labnet/"
Source = "https://github.com/mill0851/labnet"
Issues = "https://github.com/mill0851/labnet/issues"
Changelog = "https://github.com/mill0851/labnet/blob/main/CHANGELOG.md"

# One entry per device type; `labnet driver build` checks these against the protos.
[project.entry-points."labnet.devices"]
dummy_aom = "labnet_sim._generated.contracts:DUMMY_AOM_CONTRACT"
dummy_awg = "labnet_sim._generated.contracts:DUMMY_AWG_CONTRACT"
dummy_device = "labnet_sim._generated.contracts:DUMMY_DEVICE_CONTRACT"
dummy_eom = "labnet_sim._generated.contracts:DUMMY_EOM_CONTRACT"
dummy_laser = "labnet_sim._generated.contracts:DUMMY_LASER_CONTRACT"
simulated_tunable_laser = "labnet_sim._generated.contracts:SIMULATED_TUNABLE_LASER_CONTRACT"
simulated_wavemeter = "labnet_sim._generated.contracts:SIMULATED_WAVEMETER_CONTRACT"

# labnet driver build: protos/labnet_sim/v1/*.proto -> src/labnet_sim/_generated/
[tool.labnet.driver]
package = "labnet_sim"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labnet_sim*"]
namespaces = false

[tool.setuptools.package-data]
"labnet_sim._generated" = ["*.pyi"]
