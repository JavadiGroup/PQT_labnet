[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet"
version = "3.0.0.dev0"
description = "Typed device control and acquisition services for a lab network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.81.1,<2.0",
    "httpx>=0.27,<1.0",
    "protobuf>=6.33.5,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
lab-pc = [
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "uvicorn>=0.30,<1.0",
]
central = [
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.115,<1.0",
    "SQLAlchemy>=2.0.52,<3.0",
    "uvicorn>=0.30,<1.0",
]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
certs = [
    "cryptography>=42,<47",
]
# Building driver protos (labnet driver build). Pinned: generated code must not change with it.
driver-dev = [
    "grpcio-tools==1.81.1",
]

[project.scripts]
labnet = "labnet.cli:main"
labnet-central = "labnet.central.main:main"
labnet-central-admin = "labnet.central.manage:main"
labnet-lab-pc = "labnet.lab_pc.app:main"
labnet-certs = "labnet.certs:main"

[project.entry-points."labnet.commands"]
driver = "labnet.driver.cli:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labnet*"]
namespaces = false

[tool.setuptools.package-data]
labnet = ["py.typed", "protos/labnet/devices/v1/*.proto"]
"labnet.driver" = ["template/*.tmpl"]
"labnet.grpc.generated" = ["*.pyi"]
"labnet.central" = [
    "alembic.ini",
    "alembic/*.py",
    "alembic/*.mako",
    "alembic/versions/*.py",
]
