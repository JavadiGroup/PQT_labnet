[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet"
version = "3.0.0"
description = "Typed device control and acquisition services for a lab network"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Robert Miller" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "grpcio>=1.81.1,<2.0",
    "httpx>=0.27,<1.0",
    "protobuf>=6.33.5,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Documentation = "https://mill0851.github.io/labnet/"
Source = "https://github.com/mill0851/labnet"
Issues = "https://github.com/mill0851/labnet/issues"
Changelog = "https://github.com/mill0851/labnet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
lab-pc = [
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "uvicorn>=0.30,<1.0",
]
central = [
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.115,<1.0",
    "SQLAlchemy>=2.0.52,<3.0",
    "uvicorn>=0.30,<1.0",
]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
certs = [
    "cryptography>=42,<47",
]
# Building driver protos (labnet driver build). Pinned: generated code must not change with it.
driver-dev = [
    "grpcio-tools==1.81.1",
]

[project.scripts]
labnet = "labnet.cli:main"
labnet-central = "labnet.central.main:main"
labnet-central-admin = "labnet.central.manage:main"
labnet-lab-pc = "labnet.lab_pc.app:main"
labnet-certs = "labnet.certs:main"

[project.entry-points."labnet.commands"]
bundle = "labnet.release.cli:register_bundle"
dev = "labnet.dev.cli:register"
driver = "labnet.driver.cli:register"
update = "labnet.release.cli:register_update"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labnet*"]
namespaces = false

[tool.setuptools.package-data]
labnet = ["py.typed", "protos/labnet/devices/v1/*.proto"]
"labnet.driver" = ["template/*.tmpl"]
"labnet.release" = ["install.ps1"]
"labnet.grpc.generated" = ["*.pyi"]
"labnet.central" = [
    "alembic.ini",
    "alembic/*.py",
    "alembic/*.mako",
    "alembic/versions/*.py",
]
