syntax = "proto3";

package labnet.devices.v1;

import "google/protobuf/empty.proto";

// The confidence a consumer should place in a scalar measurement.
// Device adapters may provide more detailed status text alongside this enum.
enum MeasurementQuality {
  MEASUREMENT_QUALITY_UNSPECIFIED = 0;
  MEASUREMENT_QUALITY_GOOD = 1;
  MEASUREMENT_QUALITY_SUSPECT = 2;
  MEASUREMENT_QUALITY_BAD = 3;
}

// A single scalar observation. This shape is intentionally suitable for
// wavemeters, temperature sensors, power meters, and similar feedback signals.
message ScalarMeasurement {
  // Zero-based sequence number within a stream. Unary reads use zero.
  uint64 sequence = 1;

  // UTC Unix epoch timestamp in nanoseconds. Hardware/driver acquisition time
  // is preferred; scalar-only adapters fall back to server receipt time.
  int64 timestamp_ns = 2;

  double value = 3;
  string unit = 4;
  MeasurementQuality quality = 5;

  // A short, stable machine-readable status such as "OK" or "NON_FINITE".
  string status = 6;

  // Empty when the device is not channel-addressable.
  string channel = 7;
}

// Lossless result values for contract-driven unary device commands. The
// explicit integer variants avoid JSON-number coercion for encoder positions
// and controller error codes.
message IntegerSequence {
  repeated sint64 values = 1;
}

// Finite doubles, e.g. a spectrum's counts or wavelength axis.
message FloatingPointSequence {
  repeated double values = 1;
}

message CommandResult {
  oneof kind {
    google.protobuf.Empty none_value = 1;
    bool boolean_value = 2;
    sint64 integer_value = 3;
    double floating_point_value = 4;
    string text_value = 5;
    IntegerSequence integer_sequence = 6;
    FloatingPointSequence floating_point_sequence = 7;
  }
}

message CommandResponse {
  string operation_id = 1;
  CommandResult result = 2;
}
