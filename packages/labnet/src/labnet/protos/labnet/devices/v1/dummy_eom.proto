syntax = "proto3";

package labnet.devices.v1;

import "labnet/devices/v1/common.proto";
import "labnet/devices/v1/rpc_options.proto";
import "labnet/devices/v1/transfer.proto";

message DummyEomRequest {
  string device_id = 1;
  string operation_id = 2;
}

message DummyEomWriteRequest {
  string device_id = 1;
  string operation_id = 2;
  double value = 3;
  optional string unit = 4;
}

message DummyEomRfEnabledRequest {
  string device_id = 1;
  string operation_id = 2;
  bool enabled = 3;
}

message DummyEomMeasurementResponse {
  string operation_id = 1;
  ScalarMeasurement measurement = 2;
}

// A simulated resonant electro-optic phase modulator (resonance 20 MHz, Q 20).
// The modulation depth follows the RF amplitude and falls off away from
// resonance; the carrier and first sidebands follow the Bessel functions J0
// and J1 of the modulation depth.
service DummyEOMService {
  // Fraction of the optical power left in the carrier: J0(depth)^2.
  rpc ReadCarrierFraction(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_carrier_fraction"
      default_unit: "1"
    };
  }

  rpc ReadModulationDepth(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_modulation_depth"
      default_unit: "rad"
    };
  }

  rpc ReadModulationFrequency(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_modulation_frequency"
      default_unit: "MHz"
    };
  }

  rpc ReadRfAmplitude(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_rf_amplitude"
      default_unit: "V"
    };
  }

  // Fraction of the optical power in one first-order sideband: J1(depth)^2.
  rpc ReadSidebandFraction(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_sideband_fraction"
      default_unit: "1"
    };
  }

  // First sideband over carrier power: (J1/J0)^2.
  rpc ReadSidebandRatio(DummyEomRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_READ
      physical_method: "read_sideband_ratio"
      default_unit: "1"
    };
  }

  // RF drive frequency, 1 to 100 MHz.
  rpc SetModulationFrequency(DummyEomWriteRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_WRITE
      physical_method: "set_modulation_frequency"
      default_unit: "MHz"
    };
  }

  // RF drive amplitude, 0 to 3.5 V.
  rpc SetRfAmplitude(DummyEomWriteRequest) returns (DummyEomMeasurementResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_SCALAR_WRITE
      physical_method: "set_rf_amplitude"
      default_unit: "V"
    };
  }

  // Switches the RF drive on or off; returns the new state.
  rpc SetRfEnabled(DummyEomRfEnabledRequest) returns (CommandResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_UNARY_COMMAND
      physical_method: "set_rf_enabled"
      default_unit: "1"
    };
  }

  rpc StreamSidebandRatio(StreamDataRequest) returns (stream StreamDataResponse) {
    option (labnet.devices.v1.rpc) = {
      pattern: RPC_PATTERN_POLLED_SCALAR_STREAM
      physical_method: "read_sideband_ratio"
      default_unit: "1"
    };
  }
}
