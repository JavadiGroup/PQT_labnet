[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnet"
version = "0.2.0"
description = "Typed device control and acquisition services for a lab network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.81.1,<2.0",
    "httpx>=0.27,<1.0",
    "protobuf>=6.33.5,<7.0",
]

[project.optional-dependencies]
lab-pc = [
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn>=0.30,<1.0",
]
legacy-client = [
    "python-dotenv>=1.0,<2.0",
    "websockets>=13.0,<18.0",
]
dev = [
    "fastapi>=0.115,<1.0",
    "grpcio-health-checking>=1.81.1,<2.0",
    "grpcio-tools==1.81.1",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
labnet-lab-pc = "lab_pc.main:main"

[tool.setuptools]
packages = [
    "labnet",
    "labnet.client",
    "labnet.client.core",
    "labnet.device_manager",
    "labnet.devices",
    "labnet.devices.core",
    "labnet.devices.DummyDevice",
    "labnet.grpc",
    "labnet.grpc.generated",
    "labnet.grpc.services",
    "lab_pc",
]
package-dir = { labnet = "Labnet/labnet", lab_pc = "lab_pc" }

[tool.setuptools.package-data]
labnet = ["py.typed"]
"labnet.grpc.generated" = ["*.pyi"]
lab_pc = [".env.example"]

[tool.setuptools.data-files]
"share/labnet/protos/labnet/devices/v1" = [
    "Labnet/protos/labnet/devices/v1/*.proto",
]

[tool.pytest.ini_options]
testpaths = ["Labnet/tests"]
addopts = "-ra"
asyncio_mode = "auto"
