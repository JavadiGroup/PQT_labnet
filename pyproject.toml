# The LabNet development workspace. It is never built or published; the
# packages are in packages/. `uv sync` installs all of them, editable, with
# the tools below.
[project]
name = "labnet-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "labnet[lab-pc,central,certs,driver-dev]",
    "labnet-control-center",
    "labnet-automation",
    "labnet-sim",
]

[dependency-groups]
dev = [
    "import-linter>=2.1,<3",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
labnet = { workspace = true }
labnet-control-center = { workspace = true }
labnet-automation = { workspace = true }
labnet-sim = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/labnet/tests",
    "packages/labnet-control-center/tests",
    "packages/labnet-automation/tests",
    "packages/labnet-sim/tests",
    "tests",
]
addopts = "-ra"
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["labnet", "labnet_control_center", "labnet_automation", "labnet_sim"]

[[tool.importlinter.contracts]]
name = "Core and the Automation runner don't import the Control Center"
type = "forbidden"
source_modules = ["labnet", "labnet_automation"]
forbidden_modules = ["labnet_control_center"]

[[tool.importlinter.contracts]]
name = "Core doesn't import the Automation runner"
type = "forbidden"
source_modules = ["labnet"]
forbidden_modules = ["labnet_automation"]

# Device families come from driver packages through labnet.contracts.registry, so
# nothing LabNet ships depends on one; labnet-sim is only one such package.
[[tool.importlinter.contracts]]
name = "No LabNet package imports a driver package"
type = "forbidden"
source_modules = ["labnet", "labnet_control_center", "labnet_automation"]
forbidden_modules = ["labnet_sim"]
